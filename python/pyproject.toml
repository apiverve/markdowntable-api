[project]
name = "apiverve-markdowntablegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Markdown Table Generator converts structured data into properly formatted markdown tables with customizable column alignment."
keywords = ["markdown table generator api", "json to markdown table", "json to markdown", "markdown generator api", "markdown table"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/markdowntable?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/markdowntable?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/markdowntable-api"
Twitter = "https://twitter.com/apivervehq"
